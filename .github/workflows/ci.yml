name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint with Ruff
        run: uv run --with ruff ruff check .

      - name: Run Pytest
        run: uv run --with pytest --with pytest-django pytest
